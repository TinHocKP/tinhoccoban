<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Path for top text -->
    <path id="topTextPath" d="M 25,100 A 75,75 0 0,1 175,100" fill="none" />
    <!-- Path for bottom text -->
    <path id="bottomTextPath" d="M 175,100 A 75,75 0 0,1 25,100" fill="none" />
  </defs>

  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="#005bac" stroke-width="2.5" />
  <circle cx="100" cy="100" r="91" fill="none" stroke="#005bac" stroke-width="1" />

  <!-- Circular Texts -->
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#005bac" letter-spacing="1">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      TRƯỜNG ĐẠI HỌC BÁCH KHOA
    </textPath>
  </text>

  <text font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#005bac" letter-spacing="0.5">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      ★ TRUNG TÂM KỸ THUẬT ĐIỆN TOÁN ★
    </textPath>
  </text>

  <!-- Inner border ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#005bac" stroke-width="2" />

  <!-- Central Gear / Polygon Symbol -->
  <g transform="translate(100,100)">
    <!-- Gear teeth background -->
    <circle cx="0" cy="0" r="54" fill="#005bac" />
    
    <!-- White ring inside gear -->
    <circle cx="0" cy="0" r="48" fill="#ffffff" />
    <circle cx="0" cy="0" r="45" fill="#005bac" />

    <!-- BK Letters -->
    <text x="0" y="5" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BK</text>
    
    <!-- TP.HCM Text -->
    <text x="0" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">TP.HCM</text>
  </g>
</svg>
