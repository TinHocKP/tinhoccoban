<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Thi Trắc Nghiệm - Trung Tâm Kỹ Thuật Điện Toán Bách Khoa</title>
  <link rel="icon" type="image/png" href="assets/logo-bk.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Container toàn bộ ứng dụng -->
  <div id="app-container">
    
    <!-- HEADER TRÊN CÙNG: RẤT GỌN CHỈ CÓ LOGO, THỜI GIAN, ĐẶT CỜ, ÔN 50 CÂU -->
    <header class="header-container compact-header">
      <div class="header-left">
        <img src="assets/logo-bk.png" alt="Logo Bách Khoa" class="logo-bk">
        <div class="header-school-info">
          <div class="center-title">TRUNG TÂM KỸ THUẬT ĐIỆN TOÁN</div>
          <div class="school-title">ĐẠI HỌC BÁCH KHOA - TP.HCM</div>
        </div>
      </div>

      <div class="header-right">
        <!-- 1. Thời gian đếm ngược -->
        <div id="header-timer" class="timer-display header-timer-badge" title="Thời gian làm bài còn lại">00 : 30 : 00</div>
        
        <!-- 2. Cụm Câu hỏi & Nút Đặt cờ -->
        <div id="header-controls-container" class="header-flag-box">
          <!-- Render động bằng JS: [Câu X] [🚩 Đặt cờ] -->
        </div>

        <!-- 3. Nút Ôn 50 câu -->
        <a href="practice.html" class="btn-goto-practice" title="Vào Ôn Thi 50 câu từng chủ đề">📚 Ôn 50 câu</a>
      </div>
    </header>

    <!-- WORKSPACE CHÍNH -->
    <main class="main-workspace">
      
      <!-- CỘT TRÁI: 30 CÂU HỎI & ĐỒNG HỒ ĐẾM NGƯỢC -->
      <aside class="left-sidebar">
        <div class="mobile-sidebar-heading">📋 Bảng 30 câu hỏi (Chạm để chọn câu):</div>
        <!-- Lưới 30 câu hỏi: 5 cột x 6 hàng -->
        <div id="questions-grid" class="questions-grid">
          <!-- 30 ô câu hỏi sẽ được sinh động bằng JS -->
        </div>

        <!-- Cụm nút nộp bài, đồng hồ đếm ngược và phiên bản -->
        <div class="left-sidebar-footer">
          <button id="btn-submit-exam" class="btn-submit-exam">Kết thúc và Nộp bài</button>
          <button id="btn-exit-app" class="btn-exit-app" style="display: none;">Thoát chương trình</button>
          <div id="timer-text" class="timer-display">00 : 30 : 00</div>
          <div class="app-version">v 1.8.5</div>
        </div>
      </aside>

      <!-- CỘT PHẢI: KHU VỰC CÂU HỎI VÀ ĐÁP ÁN -->
      <section class="right-workspace">
        <!-- Khung hiển thị câu hỏi (Trên) -->
        <div id="question-box" class="question-box">
          <!-- Nội dung câu hỏi -->
        </div>

        <!-- Thanh phân cách 3 chấm nhỏ -->
        <div class="section-divider-dots">...</div>

        <!-- Khung hiển thị các đáp án (Dưới) -->
        <div id="options-box" class="options-box">
          <!-- 4 lựa chọn A, B, C, D -->
        </div>

        <!-- Thanh điều hướng câu trước / câu tiếp theo -->
        <div id="bottom-nav-bar" class="bottom-nav-bar">
          <!-- Render động bằng JS -->
        </div>
      </section>

    </main>

  </div>

  <!-- Nạp dữ liệu 300 câu hỏi chính thức từ 6 Google Forms -->
  <script src="js/questions.js"></script>
  <!-- Nạp mã nguồn logic chính dành cho sinh viên làm bài -->
  <script src="js/app.js"></script>
</body>
</html>
